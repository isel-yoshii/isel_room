<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISEL Room</title>
  <link rel="stylesheet" href="/ui/style.css" />
</head>
<body>

  <header>
    <h1>ISEL Room</h1>
    <span id="clock"></span>
  </header>

  <!-- ===== MAIN VIEW ===== -->
  <main id="view-main" class="view active">
    <section class="present-panel">
      <h2>現在在室中</h2>
      <ul id="present-list"></ul>
      <button class="btn-secondary small" onclick="loadPresent()">更新</button>
    </section>

    <section class="action-panel">
      <button class="btn-primary large" onclick="showView('auth')">入退室</button>
      <button class="btn-secondary large" onclick="showView('register')">新規登録</button>
    </section>
  </main>

  <!-- ===== AUTH VIEW ===== -->
  <main id="view-auth" class="view">
    <div class="camera-wrap">
      <video id="auth-video" autoplay playsinline muted></video>
      <canvas id="auth-canvas" hidden></canvas>
    </div>

    <div class="controls">
      <div id="auth-result" class="result-box">カメラに顔を向けて「スキャン」を押してください</div>
      <button class="btn-primary" id="btn-scan" onclick="scanFace()">顔をスキャン</button>
      <button class="btn-confirm" id="btn-confirm" hidden onclick="confirmToggle()">入退室を確定する</button>
      <button class="btn-back" onclick="backToMain()">← 戻る</button>
    </div>
  </main>

  <!-- ===== REGISTER VIEW ===== -->
  <main id="view-register" class="view">
    <div class="register-form">
      <input type="text" id="reg-name" placeholder="名前を入力してください" />
      <select id="reg-type">
        <option value="学生">学生</option>
        <option value="管理者">管理者</option>
      </select>
    </div>

    <div class="camera-wrap">
      <video id="reg-video" autoplay playsinline muted></video>
      <canvas id="reg-canvas" hidden></canvas>
    </div>

    <div class="controls">
      <div id="reg-result" class="result-box">名前を入力してカメラに顔を向けてください</div>
      <button class="btn-primary" id="btn-register" onclick="captureAndRegister()">顔を撮影して登録</button>
      <button class="btn-back" onclick="backToMain()">← 戻る</button>
    </div>
  </main>

  <script src="/ui/app.js"></script>
</body>
</html>
